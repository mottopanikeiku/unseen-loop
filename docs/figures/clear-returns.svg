  <a href="../../artifacts/studies/unseen-loop-release-analysis-004/ablation-effects.jsonl">
    <text x="32" y="570" font-weight="700">Weighting</text>
    <line x1="348.064" x2="558.835" y1="563" y2="563" stroke="#385c7c" stroke-width="4" />
    <line x1="348.064" x2="348.064" y1="556" y2="570" stroke="#385c7c" stroke-width="2" />
    <line x1="558.835" x2="558.835" y1="556" y2="570" stroke="#385c7c" stroke-width="2" />
    <circle cx="454.327" cy="563" r="6" fill="#385c7c" />
    <text x="655" y="570" fill="#385c7c">-108.461 [-288.061, 68.172]</text>
    <text x="32" y="600" font-size="18">Weighted minus unweighted</text>
  </a>
  <text x="32" y="652" font-size="18">Zero = no mean difference. Intervals crossing zero do not establish equivalence.</text>
  <text x="32" y="681" font-size="18">Reward scales differ across tasks; compare each student with its own teacher.</text>
