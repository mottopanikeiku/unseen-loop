<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 750" width="1080" height="750" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172b3a">
  <title id="title">Distillation in the clear: Acrobot loses return</title>
  <desc id="description">Paired clear integer-student minus teacher returns, followed by matched clear CartPole ablations. Dots and whiskers use the committed bootstrap estimates and 95% intervals. No encrypted RL rollouts are plotted.</desc>
  <rect width="1080" height="750" fill="#ffffff" rx="12" />
  <text x="32" y="44" font-size="29" font-weight="700">Distillation in the clear: Acrobot loses return</text>
  <text x="32" y="78">CLEAR rollouts only. Dots = estimates; whiskers = recorded 95% bootstrap CIs.</text>
  <text x="270" y="114" font-weight="700">Return difference</text>
  <text x="655" y="114" font-weight="700">Estimate [95% CI]</text>
  <line x1="281.833" x2="281.833" y1="143" y2="630" stroke="#e0e6eb" stroke-dasharray="none" />
  <text x="281.833" y="139" text-anchor="middle" font-size="17">-400</text>
  <line x1="400.167" x2="400.167" y1="143" y2="630" stroke="#e0e6eb" stroke-dasharray="none" />
  <text x="400.167" y="139" text-anchor="middle" font-size="17">-200</text>
  <line x1="518.500" x2="518.500" y1="143" y2="630" stroke="#647889" stroke-dasharray="5 5" />
  <text x="518.5" y="139" text-anchor="middle" font-size="17">0</text>
  <line x1="607.250" x2="607.250" y1="143" y2="630" stroke="#e0e6eb" stroke-dasharray="none" />
  <text x="607.25" y="139" text-anchor="middle" font-size="17">150</text>
  <a href="../../artifacts/studies/unseen-loop-release-analysis-004/expanded-environments.jsonl">
    <text x="32" y="187" font-weight="700">CartPole-v1</text>
    <line x1="476.499" x2="518.543" y1="180" y2="180" stroke="#385c7c" stroke-width="4" />
    <line x1="476.499" x2="476.499" y1="173" y2="187" stroke="#385c7c" stroke-width="2" />
    <line x1="518.543" x2="518.543" y1="173" y2="187" stroke="#385c7c" stroke-width="2" />
    <circle cx="501.058" cy="180" r="6" fill="#385c7c" />
    <text x="655" y="187" fill="#385c7c">-29.480 [-70.988, 0.072]</text>
    <text x="32" y="217" font-size="18">Teacher 461.488 → student 432.008; 500 episode pairs, 5 checkpoints</text>
  </a>
  <a href="../../artifacts/studies/unseen-loop-release-analysis-004/expanded-environments.jsonl">
    <text x="32" y="275" font-weight="700">MountainCar-v0</text>
    <line x1="517.541" x2="520.572" y1="268" y2="268" stroke="#385c7c" stroke-width="4" />
    <line x1="517.541" x2="517.541" y1="261" y2="275" stroke="#385c7c" stroke-width="2" />
    <line x1="520.572" x2="520.572" y1="261" y2="275" stroke="#385c7c" stroke-width="2" />
    <circle cx="518.971" cy="268" r="6" fill="#385c7c" />
    <text x="655" y="275" fill="#385c7c">+0.796 [-1.620, 3.502]</text>
    <text x="32" y="305" font-size="18">Teacher -194.986 → student -194.190; 500 episode pairs, 5 checkpoints</text>
  </a>
  <a href="../../artifacts/studies/unseen-loop-release-analysis-004/expanded-environments.jsonl">
    <text x="32" y="363" font-weight="700">Acrobot-v1</text>
    <line x1="289.043" x2="473.383" y1="356" y2="356" stroke="#ad3333" stroke-width="4" />
    <line x1="289.043" x2="289.043" y1="349" y2="363" stroke="#ad3333" stroke-width="2" />
    <line x1="473.383" x2="473.383" y1="349" y2="363" stroke="#ad3333" stroke-width="2" />
    <circle cx="381.295" cy="356" r="6" fill="#ad3333" />
    <text x="655" y="363" fill="#ad3333">-231.896 [-387.814, -76.253]</text>
    <text x="32" y="393" font-size="18">Teacher -94.260 → student -326.156; 500 episode pairs, 5 checkpoints</text>
  </a>
  <text x="32" y="422" font-weight="700">Matched clear CartPole ablations (different comparisons)</text>
  <a href="../../artifacts/studies/unseen-loop-release-analysis-004/ablation-effects.jsonl">
    <text x="32" y="482" font-weight="700">Refinement</text>
