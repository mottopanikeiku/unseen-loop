[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unseen-loop"
version = "0.1.0"
description = "FHE-native policy distillation with action-invariance certificates"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "mottopanikeiku", email = "176798723+mottopanikeiku@users.noreply.github.com" }]
keywords = [
  "fully-homomorphic-encryption",
  "privacy-preserving-machine-learning",
  "reinforcement-learning",
  "encrypted-inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.1,<2",
  "numpy==1.26.4",
]

[project.optional-dependencies]
fhe = ["concrete-python==2.10.0", "setuptools==75.3.0"]
cloud = ["modal>=1.5,<2"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
all = [
  "concrete-python==2.10.0",
  "setuptools==75.3.0",
  "modal>=1.5,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
unseen-loop = "unseen_loop.cli:main"

[project.urls]
Repository = "https://github.com/mottopanikeiku/unseen-loop"

[tool.hatch.build.targets.wheel]
packages = ["src/unseen_loop"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "fhe: requires the Concrete FHE runtime",
  "slow: exercises compilation, key generation, or encrypted execution",
  "modal: requires authenticated Modal credentials",
]

[tool.coverage.run]
branch = true
source = ["unseen_loop"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["unseen_loop"]
warn_unreachable = true
